services:
  - type: web
    name: phone-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: mysql-eba403a-student-90fb.h.aivencloud.com
      - key: DB_PORT
        value: "14873"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false   # Nhập thủ công trên Render dashboard (bảo mật)
      - key: DB_NAME
        value: defaultdb
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # Nhập thủ công trên Render dashboard (bảo mật)
      - key: ADMIN_FULL_NAME
        value: System Admin
      - key: ADMIN_EMAIL
        sync: false   # Nhập thủ công trên Render dashboard (bảo mật)
